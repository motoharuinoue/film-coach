name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web（型検査・テスト・ビルド）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 LTS（同梱の npm 11 で lockfile を解決する）
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 依存の向き（クリーンアーキテクチャ）の検査も含む
      - run: npm test
      - run: npm run build

  analyzer:
    name: analyzer（lint・型検査・層・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analyzer
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: services/analyzer
          enable-cache: true
      # .python-version（3.13）を uv が読む。uv.lock どおりに入れる
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # 依存の向き（クリーンアーキテクチャ）の検査
      - run: uv run lint-imports
      # TypeScript と同じ結果になること（packages/schema/fixtures/parity.v1.json）も確かめる
      - run: uv run pytest
