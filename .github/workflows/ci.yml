name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web（型検査・テスト・ビルド）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 LTS（同梱の npm 11 で lockfile を解決する）
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 依存の向き（クリーンアーキテクチャ）の検査も含む
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e（ブラウザでの操作の確認）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ダウンロードした Chromium は、Playwright の版ごとに使い回す
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # 使い回すときも、OS のライブラリは入れる
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # 公開デモ（解析サービスなし）と、手元の解析サービスにつなぐ設定（API の見本で偽の応答を返す）の両方を確かめる
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  analyzer:
    name: analyzer（lint・型検査・層・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analyzer
    steps:
      - uses: actions/checkout@v7
      # setup-uv は v10 のような大まかなタグを出していないので、細かい版まで指定する
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: services/analyzer
          enable-cache: true
      # .python-version（3.13）を uv が読む。uv.lock どおりに入れる
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # 依存の向き（クリーンアーキテクチャ）の検査
      - run: uv run lint-imports
      # TypeScript と同じ結果になること（packages/schema/fixtures/parity.v1.json）も確かめる
      - run: uv run pytest
