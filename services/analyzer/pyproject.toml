[project]
name = "film-coach-analyzer"
version = "0.1.0"
description = "Film Coach の解析サービス：骨格の時系列からフェーズと QB 指標を出す"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2",
    "jsonschema>=4.26",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "referencing>=0.37",
    "rtmlib>=0.0.16",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
film-coach = "film_coach.bootstrap:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/film_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# 実際の動画とモデルを使う確認は、明示したときだけ動かす（uv run pytest -m integration）
addopts = "-q -m 'not integration'"
markers = ["integration: 手元の動画とモデルを使う確認（CI では動かさない）"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 日本語の全角記号（、。：など）をコメントや文字列で使うため
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

# rtmlib は型情報を持たない
[[tool.mypy.overrides]]
module = ["rtmlib", "rtmlib.*"]
ignore_missing_imports = true

# ---- クリーンアーキテクチャの層（docs/adr/0007-clean-architecture.md）----
# 上の層は下の層に依存してよいが、逆は禁止。adapters と infrastructure は互いに依存しない。
# 組み立て（bootstrap.py）だけが、すべての層を import してよい。
[tool.importlinter]
root_package = "film_coach"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "層の依存の向き"
type = "layers"
layers = [
    "film_coach.adapters | film_coach.infrastructure",
    "film_coach.application",
    "film_coach.domain",
]

[[tool.importlinter.contracts]]
name = "domain と application は外部ライブラリに依存しない"
type = "forbidden"
source_modules = ["film_coach.domain", "film_coach.application"]
forbidden_modules = ["jsonschema", "referencing", "numpy", "cv2", "onnxruntime", "rtmlib", "fastapi"]
